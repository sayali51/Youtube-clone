<!DOCTYPE html>
<html>
    <title>Text practice</title>
    <head>
        <style>
    p{
        font-family: Arial;
    }
    .video-title{
        font-weight: bold;
        font-size: 18px;
        width: 300px;
        margin-bottom: 0;
    }
    .video-stats{
        font-size: 15px;
        color: rgb(128, 128, 128);
        margin-top: 5;
    }
    .author{
        font-size: 15px;
        color:  rgb(128, 128, 128);
    }
    .text{
        font-size: 14px;
        color:  rgb(128, 128, 128);
        width: 300;
        margin-bottom: 80;
    }
    .apple-text{
        font-size: 14px;
        text-align: center;
        background-color: rgb(227, 65, 64);
        color: white;
        padding-bottom: 18px;
        padding-top: 18px;
    }
    .shopnow:hover{
        text-decoration: underline;
    }
    .shopnow{
        cursor: pointer;
    }
</style>
    </head>
    <body>
        <p class="video-title" >Talking Tech and AI with Google CEO Sundar Pichai!</p>

        <p class="video-stats"> 3.4M views · 6 months ago</p>
        <p class="author">Marques Brownlee ✓</p>

        <p class="text">Talking tech and AI on the heels of Google I/O. Also a daily driver phone reveal from Google's CEO. Shoutout to Sundar!</p>

        <p class="apple-text">Shop early for the best selection of holiday favourites. <span class=shopnow>Shop now ></span> </p>

    </body>
</html>
