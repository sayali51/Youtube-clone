<!DOCTYPE html>
<html>
    <head>
        <title>Buttons practice</title>
        <style>
    .subscribe-button{
        background-color:rgb(200, 0, 0);
        color:white;
        border:none;
        padding-top: 10px;
        padding-bottom: 10px;
        border-radius:2px;
        cursor:pointer;
        margin-right:8px;
        transition:opacity 0.15s;
    }
    .subscribe-button:hover{
        opacity: 0.15 ;

    }
    .subscribe-button:active{
        opacity: 0.8;
    }
    .join-button{
        background-color:white;
        color:blue;
        border-color:blue;
        height:36px;
        width:62px;
        border-style:solid;
        border-radius:2px;
        cursor:pointer;
        transition: background-color 0.15s,
        color 0.15s;
        margin-right:8px;
    }
    .join-button:hover{
        background-color: rgb(41,118, 213);
        color:white;

    }
    .join-button:active{
        opacity: 0.7;
    }
        .tweet-button{
        background-color:rgb(2, 158,255 );
        color:white;
        border:none;
        height:36px;
        width:74px;
        border-radius:50px;
        cursor:pointer;
        font-weight:bold;
        font-size:15px;
    }
    .tweet-button:hover{
        box-shadow: 10px 10px 10px rgba(0, 0, 0, 0.15);
    }
</style>
</head>
    <body>
        <button class="subscribe-button">SUBSCRIBE</button>
        <button class="join-button">JOIN</button>
        <button class="tweet-button">Tweet</button>
    </body>
</html>
